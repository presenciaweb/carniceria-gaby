<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carnicería Gaby — Tu opinión</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(180deg, #fdf6ec 0%, #f5e8d6 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: #ffffff;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    max-width: 420px;
    width: 100%;
    padding: 36px 28px;
    text-align: center;
  }
  h1 {
    font-size: 22px;
    color: #3a2a1a;
    margin-bottom: 6px;
  }
  .subtitle {
    font-size: 15px;
    color: #7a6a58;
    margin-bottom: 32px;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 18px;
    border-radius: 14px 14px 0 0;
    font-size: 17px;
    font-weight: 600;
    text-decoration: none;
    transition: transform 0.1s ease;
  }
  .btn:active { transform: scale(0.97); }
  .group-good {
    background: #2e7d32;
    border-radius: 14px;
    margin-bottom: 36px;
    overflow: hidden;
  }
  .btn-good {
    background: #2e7d32;
    color: #fff;
  }
  .star-instructions {
    font-size: 14px;
    color: #ffffff;
    background: #256a29;
    border-radius: 0 0 14px 14px;
    padding: 12px 14px;
    line-height: 1.4;
  }
  .divider {
    font-size: 12px;
    color: #b5a898;
    margin-bottom: 16px;
  }
  .btn-regular {
    background: #f5f5f5;
    color: #4a3a2a;
    border: 2px solid #e0d5c5;
    border-radius: 14px;
  }
  .emoji { font-size: 28px; display: block; margin-bottom: 4px; }
  footer {
    margin-top: 28px;
    font-size: 12px;
    color: #b5a898;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>¿Cómo fue tu experiencia en Carnicería Gaby?</h1>
    <p class="subtitle">Tu opinión nos ayuda a mejorar cada día</p>

    <div class="group-good">
      <a class="btn btn-good" href="https://g.page/r/CRocUlYhT2FzEBM/review" target="_blank" rel="noopener">
        <span class="emoji">😊</span>
        Muy bien — dejar reseña en Google
      </a>
      <p class="star-instructions">⭐⭐⭐⭐⭐<br>Tocá las <strong>5 estrellitas hasta que se pinten de amarillo</strong> y después escribí tu comentario</p>
    </div>

    <p class="divider">¿Algo no te gustó?</p>

    <a class="btn btn-regular" href="https://wa.me/5492291457663?text=Hola%2C%20quiero%20contarte%20algo%20sobre%20mi%20visita%20a%20Carnicer%C3%ADa%20Gaby" target="_blank" rel="noopener">
      <span class="emoji">😐</span>
      Contanos directamente
    </a>

    <footer>Carnicería Gaby · Miramar</footer>
  </div>
</body>
</html>
